name: Automated Daily 11 PM Cloud Backup

on:
  schedule:
    # Staggered schedules around 11:00 PM IST (UTC + 5:30) using off-peak minutes
    # to avoid GitHub Actions runner queue congestion (which causes 2-4 hour delays on :00 and :30)
    # 17:25 UTC = 22:55 (10:55 PM) IST
    - cron: '25 17 * * *'
    # 17:35 UTC = 23:05 (11:05 PM) IST (fallback)
    - cron: '35 17 * * *'
    # 18:05 UTC = 23:35 (11:35 PM) IST (catch-up)
    - cron: '5 18 * * *'
  # Allows manual 1-click trigger from GitHub Actions tab or external webhook anytime
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-backup]

jobs:
  cloud-backup:
    name: Run Cloud Backup to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute 11:00 PM Cloud Backup
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
        run: node scripts/cloud-backup.js
